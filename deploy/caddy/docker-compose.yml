name: caddy

# Reverse proxy partagé pour tous les sites hébergés sur ce VPS.
# À démarrer une seule fois sur le serveur : `docker compose up -d`
# Chaque nouveau site ajoute un bloc dans Caddyfile et rejoint le réseau `web`.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:
    external: true

volumes:
  caddy_data:
  caddy_config:
